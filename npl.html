<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPL Live - YoSinTV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }

  .header { text-align: center; }
  .header a {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #22d3ee;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.15s;
  }
  .header a:hover { border-color: #22d3ee; }

  /* === POPUP === */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.82);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
  }
  .popup-overlay.hidden { display: none; }

  .popup-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: popupIn 0.25s ease-out;
  }
  @keyframes popupIn {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .popup-card h2 {
    font-size: 1.4rem;
    margin-bottom: 14px;
  }

  .popup-card p {
    color: #cbd5e1;
    font-size: 0.95rem;
    margin-bottom: 8px;
  }

  .highlight {
    color: #f87171;
    font-weight: 700;
  }

  .btn-official,
  .btn-dismiss {
    display: inline-block;
    width: 100%;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-official {
    margin-top: 14px;
    background: #22d3ee;
    color: #0f172a;
    border: 1px solid #22d3ee;
  }
  .btn-official:hover { background: #06b6d4; border-color: #06b6d4; }

  .btn-dismiss {
    margin-top: 10px;
    background: transparent;
    color: #94a3b8;
    border: 1px solid #334155;
  }
  .btn-dismiss:hover { color: #f1f5f9; border-color: #94a3b8; }

  @media (max-width: 480px) {
    .container { padding: 16px; }
    .popup-card { padding: 22px 18px; }
  }
</style>
</head>
<body>
<!-- ***** POPUP NOTICE (NPL NOT BROADCAST) ***** -->
<div class="popup-overlay" id="nplPopup">
    <div class="popup-card">
        <h2>📢 Notice</h2>
        <p><span class="highlight">NPL Live is not available here.. due to a copyright claim by NETTV</span></p>
        <p style="font-size: 15px; margin-top: 4px;">Please watch from the official site.</p>
        <a href="https://webtv.nettv.com.np/npl" target="_blank" rel="noopener noreferrer" class="btn-official">Go to Official Site</a>
        <br>
        <button class="btn-dismiss" id="popupDismissBtn">Continue to site</button>
    </div>
</div>
<div class="container">
    <!-- Header Image with Link -->
    <div class="header">
        <a href="https://yonotv.net" target="_blank">YoNoTV Live Sports</a>
    </div>
</div>
<script>
  (function () {
    var popup = document.getElementById('nplPopup');
    var dismissBtn = document.getElementById('popupDismissBtn');

    function closePopup() {
      popup.classList.add('hidden');
      document.body.style.overflow = '';
    }

    dismissBtn.addEventListener('click', closePopup);
    document.body.style.overflow = 'hidden';
  })();
</script>
</body>
</html>
